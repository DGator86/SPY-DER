[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-der"
version = "0.1.0"
description = "SPY-DER System B — canonical platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "exchange-calendars>=4.5",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.5",
]

[project.scripts]
spy-der = "spy_der.cli:main"
spy-der-vps-runner = "spy_der.runtime.runner:main"
spy-der-ai-check = "spy_der.runtime.ai_check:main"
spy-der-decision-service = "spy_der.runtime.decision_service:main"
spy-der-dashboard-api = "spy_der.runtime.dashboard_api:main"
spy-der-validate = "spy_der.runtime.validation:main"
spy-der-engine = "spy_der.runtime.engine:main"
spy-der-settlement = "spy_der.runtime.settlement:main"
spy-der-dojo = "spy_der.runtime.dojo_runner:main"
spy-der-market = "spy_der.runtime.market_service:main"
spy-der-mcp = "spy_der.runtime.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dashboard tab is served by spy-der-dashboard-api from inside the installed
# package, so the assets must ship with the wheel rather than being read out of a
# checkout that may not exist on the VPS.
"spy_der.runtime" = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=spy_der --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["spy_der"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
# Type-check against 3.12: numpy 2.x's bundled stubs use a PEP 695 `type`
# statement that mypy only parses when targeting 3.12+. requires-python stays
# at 3.11 (the runtime floor) — this only affects static analysis.
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["spy_der"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pandas.*", "numpy.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "spy_der.forecasting.ood",
  "spy_der.forecasting.uncertainty",
  "spy_der.forecasting.ensemble",
  "spy_der.forecasting.conformal",
  "spy_der.forecasting.models.regime_moe",
  "spy_der.forecasting.models.mixture_experts",
  "spy_der.forecasting.models.competing_risk",
]
ignore_errors = true

