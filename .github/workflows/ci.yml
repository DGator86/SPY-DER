name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Mypy strict
        run: python -m mypy src/spy_der --strict
      - name: Full test suite with branch coverage
        run: python -m pytest
      - name: Focused parity replay and safety suites
        run: python -m pytest tests/parity tests/test_replay.py tests/test_safety.py --no-cov -q
      - name: Build wheel and sdist
        run: python -m build
